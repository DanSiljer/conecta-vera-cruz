<script>const HISTORY_CONTENT={"6":{"title":"Roma Antiga","sub":"Roma e o Mediterrâneo","alt":"Gravura do Coliseu de Roma.","edition":"historia-plano-10-v1","objective":[{"prompt":"Um barco leva potes e grãos até Roma. Em qual rio da cidade ele pode navegar?","options":["Nilo.","Tibre.","Amazonas.","Ganges."]},{"prompt":"Segundo a lenda, quais irmãos estão ligados à fundação de Roma?","options":["Zeus e Poseidon","Aquiles e Heitor","Pedro e Paulo","Rômulo e Remo"]},{"prompt":"Quem governava Roma durante a Monarquia?","options":["O rei","O presidente","O prefeito","O faraó"]},{"prompt":"Quem eram os patrícios na Roma Antiga?","options":["Soldados inimigos","Pessoas escravizadas","Membros de famílias da elite romana","Comerciantes estrangeiros apenas"]},{"prompt":"Quais atividades muitos plebeus exerciam?","options":["Agricultura e artesanato","Apenas o governo do Império","Apenas cargos de rei","Somente funções de faraó"]},{"prompt":"Qual instituição tinha grande influência política na República Romana?","options":["Prefeitura","Igreja medieval","Parlamento brasileiro","Senado"]},{"prompt":"Por que os plebeus queriam que as leis fossem escritas?","options":["Para escolher um novo rei","Para acabar com todas as leis","Para conhecer seus direitos e as regras","Para impedir o comércio"]},{"prompt":"Uma estrada liga Roma a uma cidade distante. Como ela ajudava os romanos?","options":["Levava água para as casas.","Facilitava o transporte de pessoas e produtos.","Servia para reunir o Senado.","Protegia os portos das ondas."]},{"prompt":"No mar Mediterrâneo, comerciantes de diferentes povos visitavam os mesmos portos. Além de produtos, o que podiam trocar?","options":["A direção dos ventos.","O nível das marés.","A posição das ilhas.","Costumes e conhecimentos."]},{"prompt":"Com a crise do Império Romano do Ocidente, alguns chefes locais ganharam força. O que aconteceu com o poder de Roma?","options":["Diminuiu em várias regiões.","Cresceu em todas as cidades.","Passou para os comerciantes de um único porto.","Voltou para os reis que fundaram Roma."]}]},"7":{"title":"Rotas do Atlântico","sub":"Comércio, povos e resistências","alt":"Gravura de um navio a velas em mar aberto.","edition":"historia-plano-10-v1","objective":[{"prompt":"No mercantilismo, por que os governos cobravam taxas sobre produtos estrangeiros?","options":["Para impedir o trabalho dos artesãos","Para acabar com a produção local","Para proteger a produção do próprio reino","Para favorecer apenas os produtos estrangeiros"]},{"prompt":"O que os reinos mercantilistas buscavam fazer no comércio?","options":["Importar mais do que exportar","Exportar mais do que importar","Acabar com as exportações","Parar de vender produtos"]},{"prompt":"Qual produto era muito importante para a economia da Bahia colonial?","options":["Petróleo","Computadores","Automóveis","Açúcar"]},{"prompt":"Uma embarcação leva farinha de Itaparica para vender em Salvador. O que essa viagem mostra sobre a baía no período colonial?","options":["Ela ligava comunidades pelo comércio.","Ela separava os locais de pesca dos mercados.","Ela servia apenas às viagens para Portugal.","Ela substituía o cultivo de alimentos."]},{"prompt":"Quais produtos eram comercializados em antigas rotas da África ocidental?","options":["Celulares e computadores","Gasolina e plástico","Ouro e sal","Automóveis e pneus"]},{"prompt":"Pessoas africanas eram levadas à força para trabalhar na América. Como é chamado esse deslocamento pelo oceano?","options":["Viagem de peregrinação.","Tráfico atlântico de pessoas escravizadas.","Migração de trabalhadores livres.","Expedição de comerciantes independentes."]},{"prompt":"Duas comunidades indígenas têm línguas e festas diferentes. O que esse exemplo ajuda a entender?","options":["Só a língua distingue um povo de outro.","As duas comunidades têm a mesma história.","Há diversidade entre os povos indígenas.","As festas indígenas surgiram com os europeus."]},{"prompt":"Um grupo foge de um engenho e forma um quilombo. Qual era um objetivo dessa ação?","options":["Aumentar a produção de açúcar do engenho.","Viver em liberdade e organizar a própria comunidade.","Levar pessoas escravizadas ao porto.","Cobrar taxas em nome do rei."]},{"prompt":"Por que o porto de Salvador era importante no período colonial?","options":["Porque não recebia navios","Porque não havia comércio na Bahia","Porque ficava longe do litoral","Porque facilitava o comércio de produtos"]},{"prompt":"Qual foi um importante reino da África antes da expansão marítima europeia?","options":["Império do Mali","Reino de Portugal","Império Romano","Reino da França"]}]},"8":{"title":"Brasil Império","sub":"Da Independência ao Segundo Reinado","alt":"Gravura de uma coroa imperial e de um documento.","edition":"historia-plano-10-v1","objective":[{"prompt":"O que aconteceu com a escravidão após a Independência do Brasil, em 1822?","options":["Acabou imediatamente","Foi substituída pelo voto universal","Foi proibida em toda a América","Continuou existindo"]},{"prompt":"O que se comemora na Bahia em 2 de julho?","options":["A Independência da Bahia","A Proclamação da República","A chegada da família real","A Abolição da Escravidão"]},{"prompt":"Qual poder da Constituição de 1824 dava grande autoridade ao imperador?","options":["Poder Legislativo municipal","Poder eleitoral","Poder Moderador","Poder sindical"]},{"prompt":"Uma província queria escolher seus governantes. Qual era a principal reivindicação desse grupo?","options":["Entregar mais decisões ao imperador.","Ter mais autonomia para decidir.","Voltar a ser governada por Portugal.","Cancelar todas as eleições locais."]},{"prompt":"Em 1835, africanos muçulmanos participaram de um levante em Salvador. Que revolta foi essa?","options":["Balaiada.","Revolta da Vacina.","Revolta da Chibata.","Revolta dos Malês."]},{"prompt":"Quem governou o Brasil após a abdicação de D. Pedro I, enquanto D. Pedro II era criança?","options":["Os regentes","Os reis de Portugal","Os governadores espanhóis","Os presidentes da República"]},{"prompt":"No Segundo Reinado, muitas fazendas do Sudeste produziam para vender ao exterior. Que produto se destacou nessas fazendas?","options":["Borracha.","Algodão.","Cacau.","Café."]},{"prompt":"Com a Lei de Terras de 1850, a compra passou a ser o principal caminho para obter terras públicas. Quem encontrou mais dificuldade?","options":["Famílias pobres sem dinheiro para comprar terras.","Grandes fazendeiros com dinheiro disponível.","Comerciantes que podiam comprar propriedades.","Proprietários que já tinham suas fazendas."]},{"prompt":"Luiz Gama atuou nos tribunais em defesa de pessoas escravizadas. A qual luta ele estava ligado?","options":["À expansão das lavouras escravistas.","À volta do domínio português.","Ao abolicionismo.","À criação do Poder Moderador."]},{"prompt":"Quando D. Pedro I deixou o trono, seu filho ainda era criança. Que fato explica a criação da Regência?","options":["O Brasil tinha escolhido um presidente.","O herdeiro ainda não tinha idade para governar.","Portugal tinha voltado a governar o Brasil.","O trono já pertencia a outra família."]}]},"9":{"title":"Democracia e cidadania","sub":"Redemocratização, direitos e mundo atual","alt":"Gravura do Congresso Nacional em Brasília.","edition":"historia-plano-10-v1","objective":[{"prompt":"Um jornal foi impedido de publicar uma crítica ao governo durante a ditadura. Que direito foi atingido?","options":["A liberdade de circulação.","O acesso à educação.","A liberdade de expressão.","O direito ao trabalho."]},{"prompt":"Nas Diretas Já, um cartaz dizia “Quero escolher o presidente”. O que o movimento defendia?","options":["Indicação do presidente pelos governadores.","Eleição para presidente pelo voto da população.","Escolha do presidente apenas pelo Congresso.","Nomeação do presidente pelas Forças Armadas."]},{"prompt":"Depois da ditadura, os brasileiros recuperaram direitos políticos. Como chamamos esse processo?","options":[ function newRoom(){
 modal('<div class="pad">'+modalHead('Nova turma ou avaliação')+'<p>Escolha o ano e prepare a chamada. A turma receberá um código para a avaliação de múltipla escolha.</p><form class="form" id="newform"><label class="field">Ano<select name="grade" id="ng">'+grades().map(g=>'<option value="'+g+'">'+gradeLabel(g)+'</option>').join('')+'</select></label><label class="field">Nome da turma<input required maxlength="70" name="label" placeholder="Ex.: 8º B · Vespertino"></label><label class="field">Chamada<textarea rows="5" name="names" id="nn" placeholder="Um nome por linha" required></textarea></label><button type="button" class="outline" id="reuse">'+ico('copy')+'Usar chamada do mesmo ano</button>'+errorBox+'<button type="submit" class="btn">Criar turma</button></form></div>');
 $('#reuse').onclick=async()=>{try{const r=panel.rooms.find(r=>r.grade===Number($('#ng').value)&&(selectedSchool()==='geralda'?r.id.startsWith('geralda-'):r.id.startsWith('matutino-')));if(!r)throw Error('Ainda não há uma chamada para este ano. Digite os nomes no campo acima.');const x=await api('t/detail',{room:r.id});if(!x.students.length)throw Error('A chamada deste ano ainda está vazia. Cole os nomes no campo acima.');$('#nn').value=sorted(x.students).map(s=>s.name).join('\n');}catch(e){err($('#newform'),e.message);}};
 formOn('#newform',async b=>{const {room}=await api('t/create',{...b,names:b.names.split(/\r?\n/)});panel.rooms.push(room);panel.rooms.sort((a,b)=>a.grade-b.grade||a.label.localeCompare(b.label,'pt-BR'));panel.current=room.id;dlg.close();renderRooms();await refreshDetail(true);});
}
function tickets(){
 const {room:r,students:ss}=detail;
 if(!ss.length){addNames();return;}
 const list=ss.map(s=>'<div class="ticket"><b>'+esc(s.name)+'</b><p>'+esc(r.label)+' · '+gradeLabel(r.grade)+'</p><p>Turma <b class="code">'+esc(r.code)+'</b> · Chave <b class="code">'+esc(s.pin)+'</b></p></div>').join('');
 const host=panel.access.studentUrl||location.origin;
 $('#print-area').innerHTML='<h1>'+siteName()+' · Fichas de acesso</h1><p>'+esc(schoolName())+'</p><p>'+esc(host)+'</p><div class="tickets">'+list+'</div>';
 modal('<div class="pad">'+modalHead('Fichas de acesso')+'<p>Entregue a cada estudante a sua chave individual e o código da turma.</p><div class="line"><b class="code">'+esc(r.code)+'</b><button class="outline" id="print">'+ico('print')+'Imprimir fichas</button></div><div class="scroll"><table><thead><tr><th>Estudante</th><th>Chave individual</th></tr></thead><tbody>'+ss.map(s=>'<tr><td>'+esc(s.name)+'</td><td class="code">'+esc(s.pin)+'</td></tr>').join('')+'</tbody></table></div></div>');$('#print').onclick=()=>window.print();
}
dlg.addEventListener('close',()=>{$('#print-area').innerHTML='';});
function csv(){
 const {room:r,students:ss}=detail;const rows=[['Colégio','Disciplina','Turma','Estudante','Situação','Nota','Valor','Entrega','Participantes do grupo'],...ss.map(s=>[schoolName(),subjectName(),r.label,s.name,!s.sent?'Sem entrega':s.score===null?'A corrigir':'Corrigida',s.score===null||!s.sent?'':pts(s.score),'3,0',s.sent?new Date(s.sent).toLocaleString('pt-BR',{timeZone:'America/Bahia'}):'',s.group.join(' · ')])];
 const format=x=>'"'+(/^[\s]*[=+@-]/.test(String(x))?"'":'')+String(x).replaceAll('"','""')+'"';const url=URL.createObjectURL(new Blob(['\uFEFF'+rows.map(row=>row.map(format).join(';')).join('\r\n')],{type:'text/csv;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download=(selectedSchool()==='geralda'?'Geralda_':'Luiz_Eduardo_')+(subject==='computacao'?'Computacao_':'Historia_')+r.grade+'ano_'+r.code+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),2000);
}
async function review(id){
 const {room:r}=detail;modal('<div class="pad">'+modalHead('Respostas do estudante')+'<p>Carregando…</p></div>');
 try{const res=await api('t/review',{room:r.id,student:id});if(!dlg.open)return;
 const written=res.mode==='written',qs=res.questions;modal('<div class="pad">'+modalHead(res.name)+'<p>'+esc(r.label)+' · '+modeName(res.mode)+'</p>'+(res.group.length?'<p class="note"><b>Entrega em grupo</b><br>'+res.group.map(esc).join(' · ')+(written?'<br>A correção vale para todos os participantes.':'')+'</p>':'')+(written?'<p class="note">'+(r.grade===8?'Por questão: compreensão histórica (0,4), relação entre acontecimentos (0,4) e elaboração própria (0,2).':'Considere a compreensão histórica, a justificativa e a elaboração com palavras próprias.')+'</p>':'')+'<form class="form" id="markform">'+qs.map((q,i)=>'<section class="reviewblock"><b>Questão '+(i+1)+'</b><p>'+esc(q.prompt)+'</p>'+questionVisual(q)+'<p><b>Resposta</b><br>'+esc(written?res.answers[i]:q.options[res.answers[i]])+'</p>'+(written?'<label class="field">Nota (0 a 1)<input type="number" required min="0" max="1" step="0.1" name="m'+i+'" value="'+(res.marks?res.marks[i]/10:'')+'"></label>':'<span class="pill">'+pts(res.marks[i])+' ponto</span>')+'</section>').join('')+errorBox+(written?'<button type="submit" class="btn">Salvar nota da avaliação</button>':'<button type="button" class="outline" data-close>Fechar</button>')+'</form></div>');
 if(written)formOn('#markform',async b=>{await api('t/grade',{room:r.id,student:id,marks:qs.map((_,i)=>Math.round(Number(b['m'+i])*10))});dlg.close();await refreshDetail(true);});
 }catch(e){modal('<div class="pad">'+modalHead('Respostas')+'<p class="error">'+esc(e.message)+'</p></div>');}
}
if(initialParams.get('professora')==='1'){if(mode!=='teste'&&mode!=='provas'||subject==='computacao'&&mode==='provas')mode='teste';proofMode=mode==='provas'&&subject==='historia';applySubject();updateChrome();teacher();}else {home();const g=lastGrade;if(g)openGrade(g);}
</script></body></html>
