<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Xeque na Escola: aprenda xadrez jogando no Conecta Vera Cruz." />
    <title>Xeque na Escola | Conecta Vera Cruz</title>
    <style>
      *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#062e34}
      body{overflow:hidden}.game-frame{display:block;width:100%;height:100%;border:0;background:#062e34}
      .loading{position:fixed;inset:0;display:grid;place-items:center;color:#fff;font:700 18px system-ui,sans-serif;z-index:0}
      iframe{position:relative;z-index:1}
    </style>
  </head>
  <body>
    <div class="loading">Carregando Xeque na Escola…</div>
    <iframe
      id="xequeFrame"
      class="game-frame"
      title="Jogo educativo Xeque na Escola"
      allow="clipboard-write; autoplay"
      referrerpolicy="strict-origin-when-cross-origin"
    ></iframe>
    <script>
      const gameUrl = new URL("https://xeque-na-escola.danusasiljer.chatgpt.site/game");
      gameUrl.search = location.search;
      gameUrl.hash = location.hash;
      document.getElementById("xequeFrame").src = gameUrl.toString();
    </script>
  </body>
</html>
